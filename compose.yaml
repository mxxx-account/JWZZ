services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jwzz
      MYSQL_USER: jwzz
      MYSQL_PASSWORD: jwzz_dev_only
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  mysql_data:
