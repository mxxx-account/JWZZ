server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jwzz?useUnicode=true&characterEncoding=utf8}
    username: ${DB_USER:jwzz}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
demo:
  doctor:
    email: ${DEMO_DOCTOR_EMAIL:}
    password: ${DEMO_DOCTOR_PASSWORD:}
app:
  redis:
    enabled: ${JWZZ_REDIS_ENABLED:false}
  agent:
    model-enabled: ${JWZZ_AGENT_MODEL_ENABLED:false}
    url: ${JWZZ_AGENT_URL:http://127.0.0.1:8091/v1/report-draft}
    shared-token: ${JWZZ_AGENT_SHARED_TOKEN:}
    timeout-ms: ${JWZZ_AGENT_TIMEOUT_MS:7000}
